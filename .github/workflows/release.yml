name: release

# Publishes the binaries the desktop app downloads (`scripts/download-core.mjs` there pins a version
# and verifies the checksums). Both CLI and app-core variants are published at the same version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (defaults to package.json)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile

      # Never publish something the gates have not seen.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      # Bun cross-compiles every target from one host; the app signs the macOS ones itself.
      - run: npm run build:bin -- --all
        env:
          # Baked into the app's binary only (docs/decisions/2026-09-21-report-core-errors-to-its-own-sentry-project.md).
          ATOMIC_CORE_SENTRY_DSN: ${{ secrets.ATOMIC_CORE_SENTRY_DSN }}
          ATOMIC_CORE_SENTRY_ENVIRONMENT: production
          ATOMIC_CORE_GIT_SHA: ${{ github.sha }}

      - name: Name the assets and checksum them
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          for path in dist/bin/atomic-chat-core-*; do
            name="$(basename "$path")"
            triple="${name#atomic-chat-core-}"
            cp "$path" "release/atomic-chat-core-$version-$triple"
          done
          for path in dist/bin/atomic-chat-app-core-*; do
            name="$(basename "$path")"
            triple="${name#atomic-chat-app-core-}"
            cp "$path" "release/atomic-chat-app-core-$version-$triple"
          done
          cd release
          sha256sum atomic-chat-core-* atomic-chat-app-core-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: atomic-chat-core-binaries
          path: release/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

name: release

# Publishes the binaries the desktop app downloads (`scripts/download-core.mjs` there pins a version
# and verifies the checksums). Both CLI and app-core variants are published at the same version.
#
# To release: `npm run release -- patch|minor|major|X.Y.Z` (scripts/release.mjs bumps, commits and
# tags), then `git push --follow-tags`. The pushed `v*` tag runs this workflow for that commit, after
# the same gates as `ci.yml`. Run workflow (or `gh workflow run release.yml --ref <branch>`) does the
# same for the package.json version at a branch head and creates the tag. A published version is
# never replaced: the app pins it and checks its checksums, so a second run for it fails.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fails in seconds, before the gates spend their ten minutes.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the version and refuse one already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already released. Bump the version first: npm run release -- patch"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # An annotated tag lists its commit on the peeled `^{}` line, which comes last.
            tagged="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists on $tagged, not on $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  # Never publish something the gates have not seen: all three OSes, e2e against the binary.
  gates:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [version, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile

      # Bun cross-compiles every target from one host; the app signs the macOS ones itself.
      - run: npm run build:bin -- --all
        env:
          # Both binaries report as `production` (docs/decisions/2026-09-22-the-core-owns-its-error-reporting.md);
          # the secret, when set, overrides the DSN in the source.
          ATOMIC_CORE_SENTRY_DSN: ${{ secrets.ATOMIC_CORE_SENTRY_DSN }}
          ATOMIC_CORE_SENTRY_ENVIRONMENT: production
          ATOMIC_CORE_GIT_SHA: ${{ github.sha }}

      # The same check the app's `download-core.mjs` makes before it bundles a binary.
      - name: Check the binaries report the version
        run: |
          for name in atomic-chat-core atomic-chat-app-core; do
            got="$("dist/bin/$name-x86_64-unknown-linux-gnu" --version)"
            test "$got" = "$VERSION" || { echo "::error::$name reports '$got', expected $VERSION"; exit 1; }
          done

      - name: Name the assets and checksum them
        run: |
          mkdir -p release
          for path in dist/bin/atomic-chat-core-*; do
            name="$(basename "$path")"
            triple="${name#atomic-chat-core-}"
            cp "$path" "release/atomic-chat-core-$VERSION-$triple"
          done
          for path in dist/bin/atomic-chat-app-core-*; do
            name="$(basename "$path")"
            triple="${name#atomic-chat-app-core-}"
            cp "$path" "release/atomic-chat-app-core-$VERSION-$triple"
          done
          cd release
          sha256sum atomic-chat-core-* atomic-chat-app-core-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: atomic-chat-core-binaries
          path: release/

      # From a dispatch this also creates the tag on the commit it built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then verify="--verify-tag"; fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest \
            $verify

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # No schedule: the live suites run when someone dispatches this workflow, against the newest
  # llama.cpp build (a nightly nobody watched stayed red for weeks).
  workflow_dispatch:
  # `release.yml` runs these same gates before it publishes anything.
  workflow_call:
    inputs:
      release:
        description: 'Called by the release: gates only, no live suites'
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  # `unit` and `e2e` share nothing and need nothing from `gate`, so the three start together: an
  # OS's wall time is the slower of its two jobs, not their sum. A red `gate` still fails the run,
  # and `release.yml` waits for this whole workflow before it publishes.
  unit:
    strategy:
      fail-fast: false
      matrix:
        # The arm64 Linux and Windows binaries are released too, so they are proven on native arm
        # runners, not only cross-compiled (Bun ships Windows arm64 from 1.3.10).
        # Windows spawns processes slowly and runs the unit suites for 3.5-4 min, twice any other
        # OS, so its test files are split over two jobs (`--shard`, by file).
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14
          - { os: windows-2022, shard: 1/2 }
          - { os: windows-2022, shard: 2/2 }
          - { os: windows-11-arm, shard: 1/2 }
          - { os: windows-11-arm, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # bun's package cache: without it an install takes 20-40 s on the Windows runners.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      # The per-file floors were recorded on macOS. Platform branches (win32 vs POSIX) are covered
      # differently elsewhere, so the ratchet compares against that one platform and the others
      # run the same suites without it.
      - if: runner.os == 'macOS'
        run: npm run test:coverage
        env:
          # macos-14 has 3 vCPUs and Vitest forks one fewer worker than that by default.
          VITEST_MAX_FORKS: 3
      - if: runner.os != 'macOS'
        run: npm test -- ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      # These take seconds: once per OS, with the first shard.
      - if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        run: npm run test:runtime-compat
      - if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        run: bun test test/runtime-compat
      # The release binary runs on Bun: the wire contracts are replayed there too, not only on Node.
      - if: ${{ !matrix.shard || startsWith(matrix.shard, '1/') }}
        run: npm run test:contract:bun

  e2e:
    strategy:
      fail-fast: false
      matrix:
        # Same OS list as `unit`: the e2e suites drive the binary compiled on each of them.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # See `unit`.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: npm run build:bin
      - run: npm run test:e2e
        env:
          # As in `unit`: all three of macos-14's vCPUs. The e2e suites mostly wait on the compiled
          # binary and its fake engines. Empty elsewhere, which leaves Vitest's default.
          VITEST_MAX_FORKS: ${{ runner.os == 'macOS' && '3' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-chat-core-${{ matrix.os }}
          path: dist/bin/

  # A shell-script fake backend cannot be named llama-server.exe, so Windows proves the
  # spawn-a-backend path with a real llama-server and a small GGUF instead (PLAN.md §4 phase 1).
  live-backend:
    if: ${{ !inputs.release && github.event_name == 'workflow_dispatch' }}
    needs: [gate, unit, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - name: Fetch a llama.cpp build and a small GGUF
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-live-fixtures.mjs --out "$RUNNER_TEMP/live"
          echo "llama.cpp \`$(cat "$RUNNER_TEMP/live/tag.txt")\` on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Live backend tests
        shell: bash
        env:
          ATOMIC_LIVE: '1'
        # vitest directly: `npm run test:live` sets ATOMIC_LIVE inline, which cmd.exe cannot parse.
        run: |
          export ATOMIC_LIVE_UPSTREAM_BIN="$(cat "$RUNNER_TEMP/live/bin-path.txt")"
          export ATOMIC_LIVE_UPSTREAM_MODEL="$(cat "$RUNNER_TEMP/live/model-path.txt")"
          export ATOMIC_LIVE_UPSTREAM_TAG="$(cat "$RUNNER_TEMP/live/tag.txt")"
          npx vitest run --project live

  live-cloud:
    if: ${{ !inputs.release && github.event_name == 'workflow_dispatch' }}
    needs: [gate, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 } # error-report stacks depend on its format
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run test:live
        env:
          ATOMIC_LIVE: '1'
          ATOMIC_CLOUD_PROVIDERS: ${{ secrets.ATOMIC_CLOUD_PROVIDERS }}
